name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: go build -tags sqlite_fts5 $(go list ./... | grep -v moneef/desktop)
      - name: Test
        run: go test -tags sqlite_fts5 -race ./tests/...
