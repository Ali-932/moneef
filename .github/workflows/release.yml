name: Release

# Push a tag like v1.0.2 to build a signed APK and publish it as a GitHub
# release. The tag is the version; pubspec.yaml's `version:` is ignored.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.2.3 → version 1.2.3, build number 10203. Android needs the build
      # number to go up on every update, and this rises with the version.
      - name: Read the version from the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          IFS=. read -r major minor patch <<< "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # gomobile and gobind at the versions pinned in go.mod.
      - name: Build the Go core (AAR)
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          gomobile init
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" \
            gomobile bind -target=android -androidapi 21 \
            -o mobile_app/android/app/libs/moneef.aar ./mobilebridge

      - name: Build the signed APK
        env:
          MONEEF_KEYSTORE_BASE64: ${{ secrets.MONEEF_KEYSTORE_BASE64 }}
          MONEEF_KEYSTORE_PASSWORD: ${{ secrets.MONEEF_KEYSTORE_PASSWORD }}
        working-directory: mobile_app
        run: |
          export MONEEF_KEYSTORE="$RUNNER_TEMP/moneef-release.jks"
          echo "$MONEEF_KEYSTORE_BASE64" | base64 -d > "$MONEEF_KEYSTORE"
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/moneef-$VERSION.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/moneef-$VERSION.apk" \
            --title "Moneef $VERSION" --generate-notes --latest
