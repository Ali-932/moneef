name: Release

on:
  push:
    tags: ['v*']

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - { platform: linux/amd64,   os: ubuntu-latest  }
          - { platform: windows/amd64, os: windows-latest }

    runs-on: ${{ matrix.build.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux system dependencies
        if: matrix.build.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build
        working-directory: desktop
        run: wails build -platform ${{ matrix.build.platform }} -tags sqlite_fts5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneef-${{ matrix.build.os }}
          path: desktop/build/bin/*
