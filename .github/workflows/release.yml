name: Release
on:
  push:
    tags: ['v*']
env:
  NODE_OPTIONS: "--max-old-space-size=4096"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - { platform: linux/amd64,   os: ubuntu-latest  }
          - { platform: windows/amd64, os: windows-latest }
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Linux system dependencies
        if: matrix.build.platform == 'linux/amd64'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Add MinGW to PATH (CGO required for sqlite)
        if: matrix.build.platform == 'windows/amd64'
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Build for Linux
        if: matrix.build.platform == 'linux/amd64'
        working-directory: desktop
        run: wails build -platform ${{ matrix.build.platform }} -tags sqlite_fts5,webkit2_41
      - name: Build for Windows
        if: matrix.build.platform == 'windows/amd64'
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: wails build -platform ${{ matrix.build.platform }} -tags sqlite_fts5 -windowsconsole -webview2 download
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneef-${{ matrix.build.os }}
          path: desktop/build/bin/*
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
